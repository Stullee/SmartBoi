---
name: SmartBoi (Evidence Synthesis, Paper-Only)
version: "0.48.0"
slug: smartboi
description: >-
  LLM-driven cross-company evidence synthesis for equity research: ingests
  SEC EDGAR filings and news, builds a relationship graph (customer/
  supplier/competitor/regulator), accumulates per-company evidence dossiers
  with an adversarial skeptic pass, and logs hypothetical ("paper") trades
  when evidence crosses a threshold. Contains no order-placement code
  whatsoever -- it can never submit a real order, on any account, ever.
url: https://github.com/Stullee/SmartBoi
arch:
  - amd64
init: true
startup: application
boot: manual
host_network: true
ingress: true
ingress_port: 8100
map:
  - config:rw
panel_icon: mdi:graph-outline
options:
  symbols: ""
  anchor_symbols: ""
  enable_edgar_ingestion: true
  enable_relationship_backfill: true
  backfill_anchors: true
  enable_graph_refresh: true
  graph_refresh_symbols_per_day: 10
  enable_auto_supplier_research: true
  edgar_user_agent: ""
  edgar_forms: "8-K,8-K/A,10-K,10-Q,4,SC 13D,SC 13D/A,424B5,424B3"
  edgar_poll_interval_sec: 900
  edgar_lookback_days: 14
  enable_news_ingestion: true
  finnhub_api_key: ""
  news_poll_interval_sec: 3600
  news_lookback_days: 3
  anthropic_api_key: ""
  extraction_model: "claude-haiku-4-5"
  dossier_model: "claude-haiku-4-5"
  skeptic_model: "claude-haiku-4-5"
  synthesis_model: "claude-opus-5"
  synthesis_score_floor_pct: 0.6
  max_daily_llm_calls: 3000
  max_daily_usd: 3.30
  budget_share_extraction: 0.35
  budget_share_synthesis: 0.25
  budget_share_research: 0.10
  budget_reserve_synthesis: 0.15
  max_propagated_evidence_per_link: 3
  propagated_evidence_cooldown_hours: 6
  enable_ecosystem_propagation: true
  max_ecosystem_evidence_per_link: 1
  signal_confidence_threshold: 0.5
  min_independent_sources: 2
  min_independent_sources_news_only: 3
  max_horizon_days: 21
  transaction_cost_bps_per_side: 25.0
  transaction_cost_profile: "retail"
  max_favorable_drift_pct: 12.0
  signal_entry_deadline_days: 5
  stop_loss_pct: 50.0
  take_profit_pct: 100.0
  strategy_label: "hold-to-horizon"
  initial_trading_capital: 5000
  trading_currency: "EUR"
  max_concurrent_positions: 15
  enable_ib_price_feed: false
  ib_host: "127.0.0.1"
  ib_port: 7497
  ib_client_id: 27
  price_poll_interval_sec: 21600
  signal_entry_poll_interval_sec: 900
  enable_universe_autoscreen: true
  universe_screen_interval_days: 30
  universe_min_market_cap_musd: 75.0
  universe_max_market_cap_musd: 5000.0
  universe_max_analyst_count: 10
  enable_auto_accept_candidates: true
  auto_accept_anchors: true
  auto_accept_tradeables: true
  auto_accept_min_seen_count: 2
  auto_accept_max_per_day: 20
  log_level: "info"
  alert_webhook_url: ""
  enable_dashboard: true

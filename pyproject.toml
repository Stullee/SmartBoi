[project]
name = "smartboi"
version = "0.1.0"
description = "LLM-driven cross-company evidence synthesis for equity research -- paper-only signal validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "aiohttp>=3.9",
    # Upper-bounded on purpose. anthropic 1.0.0 removed `temperature` from
    # AsyncMessages.create(); the old floor-only pin let a rebuild resolve
    # across that major and the engine stopped scoring evidence for four
    # days without a crash or a failed test. A new major has to be an
    # explicit edit here, checked by
    # tests/test_llm.py::test_every_emitted_kwarg_is_accepted_by_the_INSTALLED_sdk.
    "anthropic>=1.0,<2",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "ib_async>=1.0.3",
]

[project.optional-dependencies]
# pyyaml is test-only (tests/test_config.py parses the add-on's config.yaml),
# but it is not optional in practice: without it the six schema-drift guards
# that keep ha-addons/smartboi/config.yaml in sync with Settings ERROR out
# instead of running, and CI reports a failure that reads like a broken test
# rather than a missing dependency. Measured live: every CI run on main
# failed this way for a full day of merges, so the guard that checks an
# add-on default still matches its code default was never actually enforcing.
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[project]
name = "smartboi"
version = "0.1.0"
description = "LLM-driven cross-company evidence synthesis for equity research -- paper-only signal validation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "ib_async>=1.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
